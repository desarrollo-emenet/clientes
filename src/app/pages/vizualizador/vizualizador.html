<div class="pantalla-visualizador">
  
  <div class="barra-superior">
    <button class="btn-regresar" (click)="navigateTo('estadoCuenta')">
      <span class="icono">←</span> Regresar
    </button>
    
    <div class="contenedor-alerta">
      <span class="texto-alerta">El ticket expirará en: <strong>{{ segundosRestantes }}s</strong></span>
    </div>
  </div>

  <div class="linea-progreso" [style.width.%]="porcentajeTiempo"></div>

  <div class="contenedor-pdf">
    <iframe 
      *ngIf="urlNueva" 
      [src]="urlNueva" 
      type="application/pdf">
    </iframe>
  </div>

</div>
