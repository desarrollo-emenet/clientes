<div class="d-flex flex-column">

  <div class="app-header" *ngIf="showheader">
    <app-header></app-header>
  </div>

  <div class="app-wrapper">

    <!-- Contenido -->
    <main>
      <router-outlet></router-outlet>
    </main>

    <!-- notificaciones push dentro de la app -->
    <div class="push-banner" *ngIf="bannerVisible$ | async" (click)="clickBanner()">
      <div class="banner-icon"><i class="fa-solid fa-bell"></i></div>
      <div class="banner-content">
        <h4>{{ (notification$ | async)?.title }}</h4>
        <p>{{ (notification$ | async)?.body }}</p>
      </div>
      <button class="banner-close" (click)="cerrarBanner($event)">✕</button>
    </div>

  </div>

  <!-- Bottom nav — solo móvil (<768px) -->
  <nav class="bottom-nav d-md-none" *ngIf="showSidebar" [ngClass]="{ 'hidden': bottomNavOculto }">
    <app-nav></app-nav>
  </nav>

  <!--<app-footer *ngIf="showFooter"></app-footer>-->

  <ngx-sonner-toaster richColors position="top-center" closeButton [visibleToasts]="1" ></ngx-sonner-toaster>

</div>
