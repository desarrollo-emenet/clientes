<div class="recover-layout flip-in" [class.flip-out]="isFlipping">
  <div class="text-center mb-4 mt-n4">
    <img src="assets/img/emenetLogo.webp" alt="Emenet Logo" height="70">
  </div>

  <div class="ep-container">

    <!-- ENCABEZADO -->
    <div class="ep-header">
      <div class="ep-header-icon">
        <i class="fa-solid fa-key"></i>
      </div>
      <div class="ep-header-content">
        <h2>Recuperar contraseña</h2>
      </div>
    </div>

    <!-- FORMULARIO -->
    <form [formGroup]="recoverForm" (ngSubmit)="recover()">

        
        <div class="ep-card-grid">

          <!-- Campo: Correo electrónico -->
          <div class="ep-field">
            <label for="exampleInputEmail1">Ingrese su correo electrónico</label>
            <input formControlName="email" type="email" class="ep-input" id="exampleInputEmail1"
              placeholder="correo@dominio.com" aria-describedby="emailHelp" />

            <div *ngIf="email.invalid && (email.dirty || email.touched)" class="ep-error">
              <span *ngIf="email.errors?.['required']">Email requerido</span>
              <span *ngIf="email.errors?.['email']">
                Email debe tener formato válido
              </span>
            </div>
          </div>

          <!-- Enlaces: Regresar -->
          <div class="ep-links-row">
            <a (click)="isFlipping = http.goToUrl('/iniciar-sesion')" class="ep-link" style="cursor: pointer;">
              Regresar a inicio de sesión
            </a>
          </div>
        </div>

      <!-- Botón Recuperar -->
      <div class="ep-actions">

        <div *ngIf="countdown > 0" class="countdown-container">
          <span class="countdown-text">
            Reintentar en <strong>{{ Math.floor(countdown / 60) }}:{{ (countdown % 60) | number:'2.0-0' }}</strong>
          </span>
        </div>

        <button type="submit" class="ep-submit-btn" [disabled]="loading || countdown > 0">
          <span *ngIf="loading && countdown > 0" class="spinner-border spinner-border-sm me-2"></span>
          <span *ngIf="!loading && countdown === 0">RECUPERAR</span>
        </button>
      </div>

    </form>

  </div>
</div>
<ngx-sonner-toaster richColors closeButton position="top-center" [visibleToasts]="1"/>
